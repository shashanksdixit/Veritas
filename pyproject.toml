[project]
name = "veritas"
version = "0.1.0"
description = "CLI-based, multi-agent code review tool (grounded, SAST-backed, PR-aware)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "httpx>=0.28.0,<0.29",
    "typer>=0.16.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0"]
test = ["pytest>=8.0"]

[project.scripts]
veritas = "veritas.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veritas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
